<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Error</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            cursor: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }

        #scare-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 10000;
            overflow: hidden;
            animation: screenShake 0.1s infinite;
        }

        #bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.8;
            filter: grayscale(100%) contrast(150%) brightness(0.7);
            transition: background-image 0.1s;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: red;
            opacity: 0;
            z-index: 10002;
            pointer-events: none;
            animation: flashAnim 0.2s infinite;
        }

        @keyframes flashAnim {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.4; }
        }

        .text-container {
            position: relative;
            z-index: 10003;
            text-align: center;
            padding: 20px;
            animation: textShake 0.1s infinite;
            pointer-events: none;
            text-shadow: 0 0 20px #000, 0 0 40px #000;
        }

        .text-ar {
            color: #ff0000;
            font-size: 3.5rem;
            font-weight: 900;
            text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .text-en {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #ff0000;
            direction: ltr;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(1deg); }
            50% { transform: translate(-5px, 5px) rotate(-1deg); }
            75% { transform: translate(5px, -5px) rotate(1deg); }
            100% { transform: translate(-5px, -5px) rotate(0deg); }
        }

        @keyframes textShake {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2px, -2px) scale(1.05); }
            100% { transform: translate(-2px, 2px) scale(1); }
        }

        @media (max-width: 600px) {
            .text-ar { font-size: 2.5rem; }
            .text-en { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="scare-screen">
        <div id="bg-image"></div>
        <div class="flash"></div>
        
        <div class="text-container">
            <div class="text-ar">تم اختراقك من طرف<br>GODZILLA</div>
            <div class="text-en">YOU HAVE BEEN HACKED BY GODZILLA</div>
        </div>
    </div>

    <audio id="hack-sound" src="hack.mp3" preload="auto" loop></audio>

    <script>
        const audio = document.getElementById('hack-sound');
        const bgImage = document.getElementById('bg-image');
        let played = false;

        const images = ['1.jpg', '2.jpg', '3.jpg'];
        let currentImageIndex = 0;

        function switchImages() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            bgImage.style.backgroundImage = `url('${images[currentImageIndex]}')`;
        }

        bgImage.style.backgroundImage = `url('${images[0]}')`;
        setInterval(switchImages, 300);

        function playAudio() {
            if (played) return;
            played = true;
            
            audio.volume = 1.0;
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio blocked:", e));

            if (navigator.vibrate) {
                navigator.vibrate([1000, 200, 1000, 200, 1000]);
            }

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        // تشغيل الصوت بمجرد لمس الشاشة
document.addEventListener('touchstart', playAudio, { once: true });
document.addEventListener('mousedown', playAudio, { once: true });
document.addEventListener('click', playAudio, { once: true });
    </script>
</body>
</html>
